<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cabina - Escuela 21 de Noviembre</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <img src="img/escudo.png" alt="Escudo de la escuela" class="topbar-escudo" />
    <div class="topbar-texto">
      <strong>Cabina · Escuela 21 de Noviembre</strong>
      <span>Ciencia y Virtud · Esquipulas · Profechan</span>
    </div>
    <a class="topbar-link" href="index.html">← Inicio</a>
  </header>

  <main class="container">

    <div class="grid-2">

      <!-- GRABADORA -->
      <section class="card">
        <h2>Grabar episodio</h2>

        <div class="form-row">
          <input id="titulo" type="text" placeholder="Título del episodio" maxlength="120" />
          <input id="alumno" type="text" placeholder="Alumno o equipo" maxlength="120" />
        </div>

        <textarea id="descripcion" rows="2" placeholder="Descripción (opcional)"></textarea>

        <div class="btn-row">
          <button id="btnGrabar" class="btn btn-rec"><span class="dot"></span>Grabar</button>
          <button id="btnDetener" class="btn" disabled>Detener</button>
        </div>

        <p id="estadoGrabacion" class="estado"></p>
      </section>

      <!-- SALA EN VIVO -->
      <section class="card">
        <h2>Sala en vivo</h2>
        <iframe
          id="jitsiFrame"
          title="Sala en vivo"
          allow="camera; microphone; autoplay; display-capture; clipboard-write"
        ></iframe>
      </section>

    </div>

    <!-- REPRODUCTOR -->
    <section class="card">
      <div class="card-head">
        <h2>Reproductor de cabina</h2>
        <div class="btn-row">
          <button id="btnLoop" class="btn btn-gold">Loop 3 audios</button>
          <button id="btnStop" class="btn btn-ghost">Detener</button>
        </div>
      </div>

      <p id="estadoReproduccion" class="estado"></p>
      <audio id="reproductor" controls></audio>
      <div id="loopList" class="loop-list"></div>
    </section>

    <!-- ADMINISTRAR -->
    <section class="card">
      <div class="card-head">
        <h2>Episodios</h2>
        <button id="btnActualizar" class="btn btn-ghost">Actualizar</button>
      </div>

      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Alumno</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaAudios"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL EDITAR -->
  <dialog id="editModal">
    <form id="editForm">
      <h3>Editar episodio</h3>

      <input type="hidden" id="editId" />

      <label for="editTitulo">Título</label>
      <input id="editTitulo" required />

      <label for="editAlumno">Alumno</label>
      <input id="editAlumno" />

      <label for="editDescripcion">Descripción</label>
      <textarea id="editDescripcion" rows="2"></textarea>

      <div class="btn-row">
        <button type="button" id="btnCancelarEditar" class="btn btn-ghost">Cancelar</button>
        <button type="submit" class="btn btn-gold">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
